<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estuda Sina V2 — Live Preview</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0d1b24;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
  </style>
</head>
<body>
  <div class="loading">Carregando a versão mais recente…</div>
  <script>
    const owner = 'gustavorosacorrea';
    const repo = 'estudasina';
    const branch = 'redesign-v2';
    const branchApi = `https://api.github.com/repos/${owner}/${repo}/branches/${branch}`;

    fetch(branchApi, {
      headers: { 'Accept': 'application/vnd.github+json' },
      cache: 'no-store'
    })
      .then(response => {
        if (!response.ok) throw new Error(`GitHub API HTTP ${response.status}`);
        return response.json();
      })
      .then(data => {
        const commit = data?.commit?.sha;
        if (!commit) throw new Error('Commit atual não encontrado');

        const cdnBase = `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${commit}/`;
        return fetch(cdnBase + 'index.html', { cache: 'no-store' })
          .then(response => {
            if (!response.ok) throw new Error(`Preview HTTP ${response.status}`);
            return response.text();
          })
          .then(html => ({ html, cdnBase }));
      })
      .then(({ html, cdnBase }) => {
        html = html.replace('<head>', `<head><base href="${cdnBase}">`);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(error => {
        document.body.innerHTML = `<div class="loading">Não foi possível carregar a preview mais recente (${error.message}). Tente atualizar a página.</div>`;
      });
  </script>
</body>
</html>
